# Override locale: porta superset_db sull'host.
# La porta 5432 è occupata da supabase-pooler, quindi si usa 15432.
# superset_db rimane raggiungibile dagli altri container Superset
# tramite la rete Docker interna sulla porta 5432.
services:
  superset-worker:
    environment:
      # Skip editable-install at bootstrap — deps are already in the image
      # and 'uv pip install -e .[postgres]' hits a stale sqlglot constraint.
      DEV_MODE: "false"
      SKIP_POSTGRES_INSTALL: "true"
  superset-worker-beat:
    environment:
      DEV_MODE: "false"
      SKIP_POSTGRES_INSTALL: "true"
